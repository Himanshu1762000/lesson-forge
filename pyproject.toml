[project]
name = "lessonforge"
version = "1.0.0"
description = "Agentic generate -> evaluate -> regenerate loop for beginner lessons"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "openai>=1.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lessonforge = "lessonforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
